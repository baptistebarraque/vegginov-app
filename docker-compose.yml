services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only by default: reachable from this machine (the backend
      # run locally with `uv run`, tests, psql) but not from the network.
      # Docker's published ports bypass host firewalls such as ufw, so the
      # bind address is what actually keeps the database off the internet.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      # Loopback only by default: in production the HTTPS reverse proxy on
      # the same host is the only thing that should reach the API directly.
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT}:8000"
    volumes:
      # Bind mount (not a named volume) so recipe images are visible in the
      # same place whether they're saved by this container or by the CLI
      # running locally (`uv run python -m veggie_app.admin.add_recipe_cli`),
      # since both write to the same `settings.upload_dir` relative path.
      - ./backend/uploads:/app/uploads
      # Same reasoning: FlavorGraph's pickle/CSV are large external files not
      # committed to git or baked into the image — see
      # backend/data/flavorgraph/README.md.
      - ./backend/data/flavorgraph:/app/data/flavorgraph
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
