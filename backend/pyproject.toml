[project]
name = "veggie-app"
version = "0.1.0"
description = "Backend for the Veggie App recipe-similarity POC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veggie_app"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]
