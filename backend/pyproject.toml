[project]
name = "veggie-app"
version = "0.1.0"
description = "Backend for the Veggie App recipe-similarity POC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "bcrypt>=4.0",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veggie_app"]

# torch (needed only as a dependency of sentence-transformers) is pinned to
# PyTorch's CPU-only wheel index on every platform: this app never runs on a
# GPU, but the default index resolves a CUDA build (with several GB of
# nvidia-* packages) on Linux, which is what both the backend Docker image
# and CI run on. torch must stay listed as a direct dependency above for uv
# to actually honor this override — as a purely transitive dependency, uv
# silently ignores tool.uv.sources and resolves it from the default index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migration files: long autogenerate-produced lines are normal.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is Depends(...)/Form(...)/File(...) as
# a default value; that's the intended usage, not the mutable-default-argument
# bug B008 guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File"]
